<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Fit · Snehith</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="/fit/fit.css">
</head>
<body>
<header>
  <a class="brand" href="/">snehithn <span>/ fit</span></a>
  <div id="updated"></div>
</header>

<main>
  <div class="hero">
    <h1 class="title" id="title">Loading…</h1>
    <p class="value num" id="value"></p>
    <div class="status" id="status"></div>

    <div class="chart-wrap" id="chartWrap" tabindex="0" aria-label="Chart. Use left and right arrow keys to inspect values.">
      <svg id="chart" aria-hidden="true">
        <defs>
          <linearGradient id="zg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="320">
            <stop/><stop/><stop/><stop/><stop/><stop/>
          </linearGradient>
          <clipPath id="clipOn"><rect id="clipOnRect" x="-10" y="-20" height="2000" width="100000"></rect></clipPath>
          <clipPath id="clipOff"><rect id="clipOffRect" x="100000" y="-20" height="2000" width="100000"></rect></clipPath>
        </defs>
        <rect class="band" id="band" x="0" width="0" height="0"></rect>
        <path class="line off" id="lineOff" clip-path="url(#clipOff)"></path>
        <path class="line on" id="lineOn" stroke="url(#zg)" clip-path="url(#clipOn)"></path>
        <g id="pts" clip-path="url(#clipOn)"></g>
        <text class="zl" id="zlHi" text-anchor="end"></text>
        <text class="zl" id="zlLo" text-anchor="end"></text>
        <line class="cursor" id="cursor" visibility="hidden"></line>
        <circle class="dot" id="dot" r="5" visibility="hidden"></circle>
      </svg>
      <div class="note" id="note"></div>
      <div class="hover-label" id="hoverLabel" hidden></div>
      <div class="empty" id="empty" hidden></div>
    </div>
    <div class="legend" id="legend"></div>

    <nav class="ranges" id="ranges" aria-label="Time range"></nav>
  </div>

  <div class="rest">
    <section>
      <h2>Stats</h2>
      <div class="stats" id="stats"></div>
    </section>

    <section>
      <h2>Activities</h2>
      <div class="tiles" id="actTiles"></div>
      <div class="cal-scroll" id="calScroll">
        <div class="cal-months" id="calMonths"></div>
        <div class="cal" id="cal"></div>
      </div>
      <div class="cal-foot">
        <span>Training time per day · click a day to see it</span>
        <span class="cal-key">Less <i></i><i class="k1"></i><i class="k2"></i><i class="k3"></i><i class="k4"></i> More</span>
      </div>

      <h3>By type <span class="hint">Tap a type to filter</span></h3>
      <div id="types"></div>

      <h3>History <span id="filterChip"></span></h3>
      <div id="actList"></div>
      <button class="more" id="more" hidden>Show more</button>
    </section>
  </div>

  <aside aria-label="Metrics">
    <h3>Metrics</h3>
    <div id="list"></div>
  </aside>
</main>

<div class="tip" id="tip" hidden></div>
<footer>Data from Garmin Connect, synced twice a day. Green and red mark good and bad days against each metric’s zones.</footer>

<script src="/fit/fit.js" defer></script>
</body>
</html>
